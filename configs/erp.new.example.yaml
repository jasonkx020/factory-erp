# 新装示例：无行业包，走开厂配置
# 复制为 configs/erp.new.yaml 后启动
server:
  addr: ":18080"
  web_root: "web/dist"
database:
  driver: postgres
  dsn: "postgres://erp:erp@127.0.0.1:5432/erp_factory?sslmode=disable"
  init_schema: false
  migrations_dir: migrations
  schema_path: migrations/erp/schema.sql
  data_path: migrations/erp/data-dev.sql
seed:
  demo: false
product:
  profile: core
  industry_pack: none
jwt:
  secret: "REPLACE_WITH_ENV_ERP_JWT_SECRET_32CHARS"
  access_ttl_min: 120
  refresh_ttl_min: 10080
cors:
  allow_origins:
    - "*"
