openapi: 3.0.3
info:
  title: 加工厂 ERP API
  version: 1.0.0
  x-erp-protocol-version: "1.0.0"
  description: |
    加工厂 ERP HTTP 协议（契约先行）。
    功能边界对齐《加工厂ERP系统框架设计文档》第 3 章 13 域；不另立业务域名。
    响应信封 `{ code, msg, data }`：`code=1` 成功，`code=0` 失败。
    权限码格式：`核心功能:功能模块:动作`。
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"
tags:
  - name: 健康检查
  - name: 认证
  - name: 权限中心
  - name: 产品管理
  - name: 库存管理
  - name: 生产管理
  - name: 工资管理
  - name: 人事管理
  - name: 审批管理
  - name: 系统管理
  - name: 销售管理
    x-erp-phase: 2
  - name: 客户管理
    x-erp-phase: 2
  - name: 采购管理
    x-erp-phase: 2
  - name: 统计报表
    x-erp-phase: 2
  - name: 财务管理
    x-erp-phase: 3
  - name: 固定资产管理
    x-erp-phase: 3
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [健康检查]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 成功或业务失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/v1/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/v1/auth/me:
    get:
      tags: [认证]
      summary: 当前用户（角色/权限/菜单/字段策略）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /api/v1/iam/users:
    get:
      tags: [权限中心]
      summary: 用户/管理员列表
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
        - name: user_type
          in: query
          schema:
            type: string
            enum: [admin, biz, line]
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
    post:
      tags: [权限中心]
      summary: 新建用户/管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/v1/iam/users/{id}:
    get:
      tags: [权限中心]
      summary: 用户详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags: [权限中心]
      summary: 更新用户
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/users/{id}/roles:
    put:
      tags: [权限中心]
      summary: 绑定用户角色（覆盖式）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/users/{id}/freeze:
    post:
      tags: [权限中心]
      summary: 冻结账号
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/users/{id}/unfreeze:
    post:
      tags: [权限中心]
      summary: 解冻账号
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/users/{id}/data-scope:
    put:
      tags: [权限中心]
      summary: 设置用户数据范围覆盖
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataScopeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/admin-groups:
    get:
      tags: [权限中心]
      summary: 管理员分组列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroupListResponse"
    post:
      tags: [权限中心]
      summary: 新建管理员分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGroupRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroupResponse"

  /api/v1/iam/admin-groups/{id}:
    get:
      tags: [权限中心]
      summary: 分组详情（含角色与成员）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroupDetailResponse"
    put:
      tags: [权限中心]
      summary: 更新分组
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGroupRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/admin-groups/{id}/roles:
    put:
      tags: [权限中心]
      summary: 绑定分组角色
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/admin-groups/{id}/users:
    put:
      tags: [权限中心]
      summary: 绑定分组成员
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/roles:
    get:
      tags: [权限中心]
      summary: 角色列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
    post:
      tags: [权限中心]
      summary: 新建角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"

  /api/v1/iam/roles/{id}:
    get:
      tags: [权限中心]
      summary: 角色详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetailResponse"
    put:
      tags: [权限中心]
      summary: 更新角色
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/roles/{id}/permissions:
    put:
      tags: [权限中心]
      summary: 更新角色权限码
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/roles/{id}/warehouse-scope:
    put:
      tags: [权限中心]
      summary: 设置角色仓范围
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_ids]
              properties:
                warehouse_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/roles/{id}/process-scope:
    put:
      tags: [权限中心]
      summary: 设置角色工序范围
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProcessScopeItem"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/permissions:
    get:
      tags: [权限中心]
      summary: 权限码字典
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"

  /api/v1/iam/permissions/sync:
    post:
      tags: [权限中心]
      summary: 按 13 域功能模块同步生成权限码
      description: 按「核心功能:功能模块:动作」生成缺失权限码
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPermResponse"

  /api/v1/iam/menus:
    get:
      tags: [权限中心]
      summary: 按角色查询自定义菜单
      parameters:
        - name: role_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuListResponse"
    put:
      tags: [权限中心]
      summary: 保存角色菜单裁剪
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuSaveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/field-policies:
    get:
      tags: [权限中心]
      summary: 字段策略（成本隐藏等）
      parameters:
        - name: role_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldPolicyListResponse"
    put:
      tags: [权限中心]
      summary: 批量保存字段策略
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldPolicySaveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/login-policy:
    get:
      tags: [权限中心]
      summary: 获取登录控制策略
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginPolicyResponse"
    put:
      tags: [权限中心]
      summary: 更新登录控制策略
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPolicy"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/iam/sessions:
    get:
      tags: [权限中心]
      summary: 会话列表
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"

  /api/v1/iam/sessions/{id}/revoke:
    post:
      tags: [权限中心]
      summary: 强制下线
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  # ---------- 产品管理（一期） ----------
  /api/v1/product/products:
    get:
      tags: [产品管理]
      summary: 产品档案列表
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
        - name: product_type
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPageResponse"
    post:
      tags: [产品管理]
      summary: 新建产品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

  /api/v1/product/products/{id}:
    get:
      tags: [产品管理]
      summary: 产品详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
    put:
      tags: [产品管理]
      summary: 更新产品
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/product/products/{id}/units:
    get:
      tags: [产品管理]
      summary: 产品单位
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUnitListResponse"
    put:
      tags: [产品管理]
      summary: 保存产品单位
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                units:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProductUnit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  # ---------- 库存管理（一期） ----------
  /api/v1/inventory/balances:
    get:
      tags: [库存管理]
      summary: 库存查询
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
        - name: warehouse_id
          in: query
          schema:
            type: integer
            format: int64
        - name: product_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancePageResponse"

  /api/v1/inventory/availability:
    get:
      tags: [库存管理]
      summary: 可用量分析（实物-待用±在途）
      parameters:
        - name: warehouse_id
          in: query
          schema:
            type: integer
            format: int64
        - name: product_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityListResponse"

  /api/v1/inventory/stock-txns:
    get:
      tags: [库存管理]
      summary: 出入库记录汇总
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
        - name: doc_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTxnPageResponse"
    post:
      tags: [库存管理]
      summary: 创建出入库单（含期初）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTxnCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTxnResponse"

  /api/v1/inventory/stock-txns/{id}/post:
    post:
      tags: [库存管理]
      summary: 过账
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEmptyResponse"

  /api/v1/inventory/transfers:
    get:
      tags: [库存管理]
      summary: 调拨列表
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkAnyResponse"
    post:
      tags: [库存管理]
      summary: 新建调拨
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkAnyResponse"

  /api/v1/inventory/stocktakes:
    get:
      tags: [库存管理]
      summary: 盘点列表
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkAnyResponse"
    post:
      tags: [库存管理]
      summary: 新建盘点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stocktake_type:
                  type: string
                  enum: [warehouse, workshop]
                warehouse_id:
                  type: integer
                  format: int64
                workshop_id:
                  type: integer
                  format: int64
                biz_date:
                  type: string
                  format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkAnyResponse"

  /api/v1/inventory/box-codes:
    get:
      tags: [库存管理]
      summary: 箱码查询
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkAnyResponse"

  # ---------- 生产管理（一期） ----------
  /api/v1/production/processes:
    get:
      tags: [生产管理]
      summary: 工序列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessListResponse"
    post:
      tags: [生产管理]
