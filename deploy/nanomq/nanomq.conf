# NanoMQ for ERP workflow realtime push
# auth callbacks point at erp-api (host network / docker host)
listeners.tcp {
  bind = "0.0.0.0:1883"
}
listeners.ws {
  bind = "0.0.0.0:8083/mqtt"
}
http_server {
  port = 8081
  limit_conn = 32
}
auth {
  allow_anonymous = false
  http {
    auth_req {
      url = "http://host.docker.internal:18080/api/v1/mqtt/auth"
      method = POST
      headers.content-type = "application/x-www-form-urlencoded"
      params.clientid = "%c"
      params.username = "%u"
      params.password = "%P"
    }
    super_req {
      url = "http://host.docker.internal:18080/api/v1/mqtt/superuser"
      method = POST
      headers.content-type = "application/x-www-form-urlencoded"
      params.clientid = "%c"
      params.username = "%u"
      params.password = "%P"
    }
    acl_req {
      url = "http://host.docker.internal:18080/api/v1/mqtt/acl"
      method = POST
      headers.content-type = "application/x-www-form-urlencoded"
      params.clientid = "%c"
      params.username = "%u"
      params.access = "%A"
      params.topic = "%t"
    }
  }
}
