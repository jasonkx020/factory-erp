components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PageNum:
      name: page_num
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
  schemas:
    OkResponseBase:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 1 成功 / 0 失败
          example: 1
        msg:
          type: string
          example: ok
    OkEmptyResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              nullable: true
    OkAnyResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              nullable: true
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: up
                driver:
                  type: string
                  example: sqlite
                server_time:
                  type: string
    LoginRequest:
      type: object
      required: [login_name, password]
      properties:
        login_name:
          type: string
        password:
          type: string
        client_type:
          type: string
          description: web/mp_worker/mp_sales/pad/boss
    LoginData:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserBrief"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginData"
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/UserBrief"
                roles:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
                menus:
                  type: array
                  items:
                    $ref: "#/components/schemas/MenuItem"
                field_policies:
                  type: array
                  items:
                    $ref: "#/components/schemas/FieldPolicy"
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login_name:
          type: string
        user_type:
          type: string
        employee_id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
    User:
      allOf:
        - $ref: "#/components/schemas/UserBrief"
        - type: object
          properties:
            role_ids:
              type: array
              items:
                type: integer
                format: int64
            data_scope_type:
              type: string
    UserCreateRequest:
      type: object
      required: [login_name, password, user_type]
      properties:
        login_name:
          type: string
        password:
          type: string
        user_type:
          type: string
        employee_id:
          type: integer
          format: int64
        role_ids:
          type: array
          items:
            type: integer
            format: int64
    UserUpdateRequest:
      type: object
      properties:
        user_type:
          type: string
        employee_id:
          type: integer
          format: int64
        status:
          type: string
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"
    UserPageResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
                total:
                  type: integer
    AdminGroupRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        remark:
          type: string
        sort_no:
          type: integer
    AdminGroup:
      allOf:
        - $ref: "#/components/schemas/AdminGroupRequest"
        - type: object
          properties:
            id:
              type: integer
              format: int64
            status:
              type: string
    AdminGroupResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminGroup"
    AdminGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminGroup"
    AdminGroupDetailResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                group:
                  $ref: "#/components/schemas/AdminGroup"
                role_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                user_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
    RoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        data_scope_type:
          type: string
          enum: [self, team, workshop, warehouse, all]
        remark:
          type: string
    Role:
      allOf:
        - $ref: "#/components/schemas/RoleRequest"
        - type: object
          properties:
            id:
              type: integer
              format: int64
            is_system:
              type: boolean
            status:
              type: string
    RoleResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Role"
    RoleListResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/Role"
    RoleDetailResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponseBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/Role"
                permission_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                warehouse_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                process_scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProcessScopeItem"
    ProcessScopeItem:
      type: object
      required: [process_id]
      properties:
        process_id:
          type: integer
          format: int64
        can_report:
          type: boolean
        can_dispatch:
          type: boolean
