<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工人小程序 · 前台</title>
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <div class="phone-page">
    <div>
      <a class="back-link" href="../index.html">← 返回展示入口</a>
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-status"><span>9:41</span><span>工人端</span></div>
          <div class="phone-header" id="mpTitle">扫码报工</div>
          <div class="phone-body" id="mpBody"></div>
          <div class="phone-tabbar" id="mpTabs">
            <button class="active" data-tab="report">报工</button>
            <button data-tab="requisition">领料</button>
            <button data-tab="wage">计件/工资</button>
            <button data-tab="hr">考勤</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side-note">
      <h3>工人小程序（文档 8.4）</h3>
      <p>仅承载表内适合现场的模块子集，不新增功能名：</p>
      <ul>
        <li>扫码报工</li>
        <li>联动式领料</li>
        <li>我的计件 / 工资（只读）</li>
        <li>考勤 / 请假</li>
        <li>公告提醒</li>
      </ul>
      <p style="margin-top:12px"><strong>成本隐藏：</strong>一线不可见成本、毛利、他人工资字段。</p>
      <p><strong>角色：</strong>计件工（去皮/去芯/切块）· 固定工（收货/切断等授权工序）。</p>
    </aside>
  </div>
  <script>
    const titles = {
      report: "扫码报工",
      requisition: "联动式领料",
      wage: "我的计件 / 工资",
      hr: "考勤 / 请假 · 公告"
    };
    const bodies = {
      report: `
        <div class="mp-card" style="text-align:center;padding:20px">
          <div style="font-size:48px;color:#0d7a6f">▣</div>
          <h4>扫描派工码报工</h4>
          <p>当前工序范围：去皮 · 去芯 · 切块</p>
          <button class="btn" style="margin-top:12px;width:100%">模拟扫码 DP-771</button>
        </div>
        <div class="mp-card">
          <h4>本次报工（示意）</h4>
          <div class="mp-list-item"><span>工序</span><strong>去皮</strong></div>
          <div class="mp-list-item"><span>交收量</span><strong>520 kg</strong></div>
          <div class="mp-list-item"><span>扣杂 / 扣水</span><strong>12 / 0</strong></div>
          <div class="mp-list-item"><span>净重</span><strong>508 kg</strong></div>
          <button class="btn" style="width:100%;margin-top:8px">提交报工</button>
        </div>`,
      requisition: `
        <div class="mp-card">
          <h4>与派工联动的领料</h4>
          <p>模块：联动式领料；过账：库存 · 物料调拨耗用</p>
        </div>
        <div class="mp-card">
          <div class="mp-list-item"><span>派工单</span><span>DP-771</span></div>
          <div class="mp-list-item"><span>物料</span><span>洗净原料</span></div>
          <div class="mp-list-item"><span>申请量</span><span>600 kg</span></div>
          <div class="mp-list-item"><span>仓库</span><span>原料仓</span></div>
          <button class="btn" style="width:100%;margin-top:8px">确认领料</button>
        </div>`,
      wage: `
        <div class="stats" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
          <div class="stat"><div class="label">今日净重</div><div class="value" style="font-size:18px">508kg</div></div>
          <div class="stat"><div class="label">今日工钱</div><div class="value" style="font-size:18px">¥91.4</div></div>
        </div>
        <div class="mp-card">
          <h4>计件明细（只读）</h4>
          <div class="mp-list-item"><span>去皮 · 508kg × ¥0.18</span><span>¥91.44</span></div>
          <div class="mp-list-item"><span>去芯 · —</span><span>—</span></div>
          <p style="margin-top:8px;font-size:11px;color:#8a9aa3">成本、毛利、他人工资已按成本隐藏策略屏蔽</p>
        </div>
        <div class="mp-card">
          <h4>本月工资结果</h4>
          <div class="mp-list-item"><span>计件合计</span><span>¥2,860</span></div>
          <div class="mp-list-item"><span>考勤/调整</span><span>¥200</span></div>
          <div class="mp-list-item"><span>应发</span><strong>¥3,060</strong></div>
        </div>`,
      hr: `
        <div class="mp-card">
          <h4>考勤打卡</h4>
          <div class="mp-list-item"><span>班次</span><span>早班 07:30–16:30</span></div>
          <div class="mp-list-item"><span>今日</span><span class="tag ok">已上班 07:28</span></div>
          <button class="btn" style="width:100%;margin-top:8px">下班打卡</button>
        </div>
        <div class="mp-card">
          <h4>请假申请</h4>
          <button class="btn ghost" style="width:100%">提交请假（进入考勤审批）</button>
        </div>
        <div class="mp-card">
          <h4>公告提醒</h4>
          <p>明日切块工价调整说明已发布（系统管理 · 公告设置）</p>
        </div>`
    };

    function show(tab) {
      document.getElementById("mpTitle").textContent = titles[tab];
      document.getElementById("mpBody").innerHTML = bodies[tab];
      document.querySelectorAll("#mpTabs button").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
    }
    document.getElementById("mpTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tab]");
      if (b) show(b.dataset.tab);
    });
    show("report");
  </script>
  <script src="../js/api.js"></script>
  <script src="../js/front-boot.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>window.ERP_FRONT_BOOT&&window.ERP_FRONT_BOOT("/payroll/wage-rates"));</script>
</body>
</html>
