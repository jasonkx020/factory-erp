; ==================== PostgreSQL Windows launcher config ====================
; Aligned with Linux scripts/service-postgres.sh and scripts/db-init.ps1

[PostgreSQL]
; Install root (pg_ctl.exe / psql.exe); "." = this directory
install_path = E:\sdk\pgsql
; Data directory (pg_ctl mode only)
data_path = .\data
port = 5432
; Bind address: 127.0.0.1 localhost only; 0.0.0.0 LAN (use firewall)
listen_bind = 127.0.0.1
version = 16
; run_mode: Windows = service | pg_ctl; Linux = systemd | pg_ctl
run_mode = pg_ctl
; Windows: empty = auto-detect postgresql-x64-16
windows_service_name =
; Linux (Ubuntu): empty = auto-detect postgresql@16-main or postgresql
systemd_service_name =
add_firewall_rules = false
log_dir = log

[Superuser]
user = postgres
; Leave empty for local pg_ctl dev (pg_hba uses trust on 127.0.0.1). Set password for scram-sha-256.
password =

[Application]
user = freetv
password = J8NU5BM8QCK4WHM8X
db_edge = freetv_edge
db_cloud = freetv_cloud

[Init]
; Default scope for init-db.bat: tenant | platform | all
default_scope = tenant
