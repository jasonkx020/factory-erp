org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Windows: pub-cache 与工程跨盘符时 Kotlin 增量编译会失败
kotlin.incremental=false
kotlin.incremental.android=false
# 首次依赖下载超时更友好；避免无限挂起无反馈
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
