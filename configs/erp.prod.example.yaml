server:
  addr: ":18080"
  web_root: ""
database:
  driver: postgres
  dsn: "postgres://erp:CHANGE_ME@127.0.0.1:5432/erp_factory?sslmode=disable"
  init_schema: false
  migrations_dir: migrations
  schema_path: migrations/erp/schema.sql
  data_path: migrations/erp/data-dev.sql
seed:
  demo: false
jwt:
  secret: "REPLACE_WITH_ENV_ERP_JWT_SECRET_32CHARS"
  access_ttl_min: 120
  refresh_ttl_min: 10080
cors:
  allow_origins:
    - "https://erp.example.com"
trace:
  hmac_secret: "REPLACE_TRACE_HMAC"
mqtt:
  enabled: false
oauth:
  enabled: false
ocr:
  enabled: false
