<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>销售小程序 · 前台</title>
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <div class="phone-page">
    <div>
      <a class="back-link" href="../index.html">← 返回展示入口</a>
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-status"><span>9:41</span><span>销售端</span></div>
          <div class="phone-header" id="mpTitle">我的订单</div>
          <div class="phone-body" id="mpBody"></div>
          <div class="phone-tabbar" id="mpTabs">
            <button class="active" data-tab="orders">订单</button>
            <button data-tab="inquiry">询价</button>
            <button data-tab="crm">跟进</button>
            <button data-tab="remind">提醒</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="side-note">
      <h3>销售小程序（文档 8.4 / 6.1）</h3>
      <ul>
        <li>自助下单（协同客户端）</li>
        <li>我的订单</li>
        <li>询价管理</li>
        <li>客户跟进</li>
        <li>任务提醒</li>
      </ul>
      <p style="margin-top:12px">受客户管理「资源分配 / 保护机制 / 线索隐藏」约束；成本预算受成本隐藏与权限控制。</p>
    </aside>
  </div>
  <script>
    const titles = { orders: "我的订单", inquiry: "询价管理", crm: "客户跟进", remind: "任务提醒" };
    const bodies = {
      orders: `
        <div class="mp-card">
          <div class="toolbar" style="margin:0">
            <button class="btn sm">新建订单</button>
            <button class="btn sm ghost">订单复购</button>
          </div>
        </div>
        <div class="mp-card">
          <div class="mp-list-item"><div><strong>SO20260804001</strong><br/><span style="font-size:12px;color:#5c6b75">华南食品 · 12,000kg</span></div><span class="tag ok">已审核</span></div>
          <div class="mp-list-item"><div><strong>SO20260803018</strong><br/><span style="font-size:12px;color:#5c6b75">粤西商贸 · 预发货占用中</span></div><span class="tag warn">预发货</span></div>
          <div class="mp-list-item"><div><strong>SO20260802007</strong><br/><span style="font-size:12px;color:#5c6b75">待发货审批</span></div><span class="tag warn">审批中</span></div>
        </div>
        <div class="mp-card"><h4>锁价 / 合同内跟踪</h4><p>销售锁价、合同管理（只读）、预发货状态</p></div>`,
      inquiry: `
        <div class="mp-card">
          <h4>提交询价</h4>
          <p>客户：华南食品 · 产品：袋装木薯丁</p>
          <div class="mp-list-item"><span>意向量</span><span>5,000 kg</span></div>
          <div class="mp-list-item"><span>期望价</span><span>¥7.2 /kg</span></div>
          <button class="btn" style="width:100%;margin-top:8px">提交（可走询价审批）</button>
        </div>
        <div class="mp-card">
          <h4>历史报价查询</h4>
          <div class="mp-list-item"><span>2026-07-12</span><span>¥7.0</span></div>
          <div class="mp-list-item"><span>2026-06-03</span><span>¥6.8</span></div>
        </div>`,
      crm: `
        <div class="mp-card">
          <h4>客户跟进</h4>
          <div class="mp-list-item"><div>华南食品<br/><span style="font-size:12px;color:#5c6b75">电话沟通交期 · 张敏</span></div><span>今天</span></div>
          <div class="mp-list-item"><div>粤西商贸<br/><span style="font-size:12px;color:#5c6b75">商机快录：意向切块料</span></div><span>昨天</span></div>
        </div>
        <div class="mp-card">
          <h4>线索查看</h4>
          <p>受保护机制 / 线索隐藏约束；无权限线索不展示。</p>
        </div>`,
      remind: `
        <div class="mp-card">
          <h4>任务提醒</h4>
          <div class="mp-list-item"><span>跟进华南食品合同续签</span><span class="tag warn">今日</span></div>
          <div class="mp-list-item"><span>询价 IQ0802-05 待财务审批协同</span><span class="tag">待办</span></div>
        </div>
        <div class="mp-card">
          <h4>报价计算器（简易）</h4>
          <p>试算后可回写询价 / 订单（完整能力在后台）。</p>
          <button class="btn ghost" style="width:100%">打开试算</button>
        </div>`
    };
    function show(tab) {
      document.getElementById("mpTitle").textContent = titles[tab];
      document.getElementById("mpBody").innerHTML = bodies[tab];
      document.querySelectorAll("#mpTabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
    }
    document.getElementById("mpTabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tab]");
      if (b) show(b.dataset.tab);
    });
    show("orders");
  </script>
  <script src="../js/api.js"></script>
  <script src="../js/front-boot.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>window.ERP_FRONT_BOOT&&window.ERP_FRONT_BOOT("/sales/orders"));</script>
</body>
</html>
