openapi: 3.0.3
info:
  title: 加工厂 ERP API
  version: 1.1.0
  x-erp-protocol-version: "1.1.0"
  description: |
    加工厂 ERP HTTP 协议（契约先行）。
    功能边界对齐《加工厂ERP系统框架设计文档》第 3 章 13 域；不另立业务域名。
    响应信封 `{ code, msg, data }`：`code=1` 成功，`code=0` 失败。
    权限码格式：`核心功能:功能模块:动作`。
    协议 1.1.0：13 域功能模块 paths 已全量展开（含二/三期）；实现按 x-erp-phase 分期落地。
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "18080"
tags:
  - name: 健康检查
  - name: 认证
  - name: 权限中心
  - name: 产品管理
  - name: 库存管理
  - name: 生产管理
  - name: 工资管理
  - name: 人事管理
  - name: 审批管理
  - name: 系统管理
  - name: 销售管理
    x-erp-phase: 2
  - name: 客户管理
    x-erp-phase: 2
  - name: 采购管理
    x-erp-phase: 2
  - name: 统计报表
    x-erp-phase: 2
  - name: 财务管理
    x-erp-phase: 3
  - name: 固定资产管理
    x-erp-phase: 3
security:
  - bearerAuth: []
