server:
  addr: ":18080"
  # 开发可外置：改前端后 npm run build:dist 即可热换，无需重编 Go
  web_root: "web/dist"
database:
  driver: sqlite
  sqlite_path: data/erp_dev.db
  # mysql_dsn: "user:pass@tcp(127.0.0.1:3306)/erp_factory?parseTime=true&charset=utf8mb4&loc=Local"
seed:
  demo: true
jwt:
  secret: "dev-only-change-me"
  access_ttl_min: 120
  refresh_ttl_min: 10080
cors:
  allow_origins:
    - "*"
trace:
  hmac_secret: "dev-trace-hmac-change-me"
mqtt:
  enabled: true
  broker: nanomq
  broker_url: "tcp://127.0.0.1:1883"
  ws_url: "ws://127.0.0.1:8083/mqtt"
  http_auth_enabled: true
  server_username: "erp-hub"
  server_password: "change-me-hub"
  client_prefix: "erp"
  tenant: "default"
  token_ttl_seconds: 43200
  keep_alive_seconds: 60
oauth:
  enabled: false
ocr:
  enabled: false
  provider: ""
