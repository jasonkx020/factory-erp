services:
  nanomq:
    image: emqx/nanomq:latest
    container_name: erp-nanomq
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8081:8081"
    volumes:
      - ./nanomq/nanomq.conf:/etc/nanomq.conf:ro
    command: ["--conf", "/etc/nanomq.conf"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
